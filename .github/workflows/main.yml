
name: Build SatyrKits

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode herunterladen
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Plugin bauen
        run: mvn --batch-mode clean package

      - name: JAR bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SatyrKits
          path: target/SatyrKits.jar
